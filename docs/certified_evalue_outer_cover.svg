<text x="64" y="682" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">The value 1 is a perturbation threshold, not a physical phase transition.</text>
<rect x="600" y="405" width="560" height="300" rx="12" fill="#ffffff" stroke="#d9e0ea"/>
<text x="624" y="440" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172033">4. Physical inference chain</text>
<text x="624" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Calibration record</text>
<text x="624" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">48 time samples x 256 independent channels</text>
<text x="624" y="525" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Certified temporal family</text>
<text x="624" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">All P51-compatible parameters are inside retained P52 cells</text>
<text x="624" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Independent target record</text>
<text x="624" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">120 samples, affine nuisance drift projected away</text>
<text x="624" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Target covariance certificate</text>
<text x="624" y="658" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">Combined confidence &gt;= 95.062%</text>
<text x="624" y="681" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#172033">Relative covariance radius = 0.899816 &lt; 1</text>
<text x="54" y="737" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#172033">The theorem certifies measurement uncertainty under the stated model. It does not identify consciousness.</text>

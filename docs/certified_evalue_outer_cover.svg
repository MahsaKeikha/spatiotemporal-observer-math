<rect x="222.91666666666669" y="283" width="184.08333333333326" height="17" rx="8" fill="#2f5f9d" stroke="none"/>
<text x="64" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">The P51 grid is a visualization. The P52 retained cells certify the continuum.</text>
<rect x="600" y="115" width="560" height="265" rx="12" fill="#ffffff" stroke="#d9e0ea"/>
<text x="624" y="150" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172033">2. Which parameter cells can be ruled out?</text>
<text x="624" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#172033">Fixed cells in declared box: 7,381</text>
<rect x="624" y="220" width="339.0800704511584" height="34" rx="6" fill="#6b8cc4" stroke="none"/>
<rect x="963.0800704511585" y="220" width="130.91992954884162" height="34" rx="6" fill="#d5dbe5" stroke="none"/>
<text x="624" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172033">Retained: 5,325  (72.1%)</text>
<text x="885" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#172033">Certified excluded: 2,056</text>
<text x="624" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#172033">P51 displayed accepted grid points: 2,447</text>
<text x="624" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#172033">A cell is discarded only when every point in it is proved outside P51.</text>

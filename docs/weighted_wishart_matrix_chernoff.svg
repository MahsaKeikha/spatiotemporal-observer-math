<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Experiment AG: exact matrix concentration removes the sphere-net bottleneck</title>
  <desc id="desc">Comparison of previous sphere-net covariance radii and Proposition 47 matrix-Laplace radii across sample counts 300, 500, and 850 and AR(1) coefficients 0.10, 0.40, 0.65, and 0.80.</desc>
  <rect width="1200" height="820" fill="white"/>
  <style>
    .title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.sub{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.pt{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.lab{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.tick{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.axis{stroke:#374151;stroke-width:1.4}.grid{stroke:#d1d5db;stroke-width:1;opacity:.7}.blue{stroke:#2563eb;fill:none;stroke-width:3}.teal{stroke:#0f766e;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}.dash{stroke:#6b7280;fill:none;stroke-width:2;stroke-dasharray:8 6}.card{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1.2}.good{fill:#ecfdf5;stroke:#a7f3d0}.warn{fill:#fff7ed;stroke:#fed7aa}.metric{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}.metric2{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9a3412}
  </style>
  <text x="600" y="40" text-anchor="middle" class="title">Experiment AG — Exact matrix concentration removes the sphere-net bottleneck</text>
  <text x="600" y="66" text-anchor="middle" class="sub">Affine nuisance projection · dimension 4 · 97.5% confidence · exact projected AR(1) eigenvalue profile</text>

  <rect x="42" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="124" text-anchor="middle" class="pt">N = 850: old versus new covariance radius</text>
  <line x1="92" y1="350" x2="552" y2="350" class="axis"/><line x1="92" y1="154" x2="92" y2="350" class="axis"/>
  <line x1="92" y1="252" x2="552" y2="252" class="dash"/>
  <text x="82" y="256" text-anchor="end" class="tick">1.0</text>
  <polyline points="112,293 245,276 390,231 525,163" class="orange"/>
  <polyline points="112,326 245,319 390,304 525,280" class="blue"/>
  <circle cx="112" cy="293" r="5" fill="#ea580c"/><circle cx="245" cy="276" r="5" fill="#ea580c"/><circle cx="390" cy="231" r="5" fill="#ea580c"/><circle cx="525" cy="163" r="5" fill="#ea580c"/>
  <circle cx="112" cy="326" r="5" fill="#2563eb"/><circle cx="245" cy="319" r="5" fill="#2563eb"/><circle cx="390" cy="304" r="5" fill="#2563eb"/><circle cx="525" cy="280" r="5" fill="#2563eb"/>
  <text x="112" y="370" text-anchor="middle" class="tick">0.10</text><text x="245" y="370" text-anchor="middle" class="tick">0.40</text><text x="390" y="370" text-anchor="middle" class="tick">0.65</text><text x="525" y="370" text-anchor="middle" class="tick">0.80</text>
  <text x="322" y="390" text-anchor="middle" class="lab">AR(1) coefficient φ</text>
  <line x1="110" y1="144" x2="138" y2="144" class="orange"/><text x="146" y="149" class="small">previous sphere-net</text><line x1="300" y1="144" x2="328" y2="144" class="blue"/><text x="336" y="149" class="small">Proposition 47</text>

  <rect x="614" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="124" text-anchor="middle" class="pt">Strong-correlation threshold crossing</text>
  <rect x="650" y="165" width="210" height="95" rx="8" class="warn"/><text x="755" y="205" text-anchor="middle" class="metric2">1.077 → 0.459</text><text x="755" y="230" text-anchor="middle" class="small">N=850, φ=0.65</text>
  <rect x="884" y="165" width="210" height="95" rx="8" class="good"/><text x="989" y="205" text-anchor="middle" class="metric">1.630 → 0.653</text><text x="989" y="230" text-anchor="middle" class="small">N=850, φ=0.80</text>
  <rect x="650" y="284" width="444" height="78" rx="8" class="good"/><text x="872" y="315" text-anchor="middle" class="metric">Below one again</text><text x="872" y="340" text-anchor="middle" class="small">The sharper theorem restores regimes usable by downstream relative perturbation bounds.</text>

  <rect x="42" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="454" text-anchor="middle" class="pt">Fractional radius reduction</text>
  <line x1="92" y1="680" x2="552" y2="680" class="axis"/><line x1="92" y1="484" x2="92" y2="680" class="axis"/>
  <line x1="92" y1="628" x2="552" y2="628" class="grid"/><line x1="92" y1="576" x2="552" y2="576" class="grid"/><line x1="92" y1="524" x2="552" y2="524" class="grid"/>
  <polyline points="112,575 245,554 390,535 525,516" class="blue"/>
  <polyline points="112,584 245,564 390,548 525,530" class="teal"/>
  <polyline points="112,590 245,575 390,562 525,548" class="orange"/>
  <text x="112" y="700" text-anchor="middle" class="tick">0.10</text><text x="245" y="700" text-anchor="middle" class="tick">0.40</text><text x="390" y="700" text-anchor="middle" class="tick">0.65</text><text x="525" y="700" text-anchor="middle" class="tick">0.80</text>
  <text x="322" y="720" text-anchor="middle" class="lab">AR(1) coefficient φ</text>
  <text x="314" y="498" text-anchor="middle" class="small">roughly 52%–65% reduction across all tested regimes</text>
  <line x1="116" y1="472" x2="144" y2="472" class="orange"/><text x="152" y="477" class="small">N=300</text><line x1="222" y1="472" x2="250" y2="472" class="teal"/><text x="258" y="477" class="small">N=500</text><line x1="328" y1="472" x2="356" y2="472" class="blue"/><text x="364" y="477" class="small">N=850</text>

  <rect x="614" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="454" text-anchor="middle" class="pt">Seeded visibility check — not the proof</text>
  <rect x="650" y="490" width="210" height="92" rx="8" class="good"/><text x="755" y="530" text-anchor="middle" class="metric">96 / 96</text><text x="755" y="554" text-anchor="middle" class="small">trials below theorem radius</text>
  <rect x="884" y="490" width="210" height="92" rx="8" class="good"/><text x="989" y="530" text-anchor="middle" class="metric">0.832</text><text x="989" y="554" text-anchor="middle" class="small">theorem radius at N=300, φ=0.65</text>
  <rect x="650" y="604" width="210" height="92" rx="8" class="good"/><text x="755" y="644" text-anchor="middle" class="metric">0.286</text><text x="755" y="668" text-anchor="middle" class="small">median observed error</text>
  <rect x="884" y="604" width="210" height="92" rx="8" class="warn"/><text x="989" y="644" text-anchor="middle" class="metric2">0.827</text><text x="989" y="668" text-anchor="middle" class="small">maximum observed error</text>

  <text x="600" y="786" text-anchor="middle" class="small">Source: docs/weighted_wishart_matrix_chernoff.json · Proof: docs/proposition_47_weighted_wishart_matrix_chernoff.md</text>
</svg>

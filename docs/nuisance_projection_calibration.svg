<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Experiment AD: time-varying mean removal by predeclared temporal projection</title>
  <desc id="desc">Four panels compare nuisance-projected covariance estimation with constant mean-centering across affine trend amplitudes 0, 1, 3, 6 and 10. The projected estimator remains near 0.14 relative error, all trials are covered by the 0.7581 analytical radius, and nuisance invariance is at floating-point precision.</desc>
  <rect width="1200" height="820" fill="white"/>
  <style>
    .title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.panel-title{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.label{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.tick{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.axis{stroke:#374151;stroke-width:1.4}.grid{stroke:#d1d5db;stroke-width:1;opacity:.65}.blue{stroke:#2563eb;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}.dash{stroke:#2563eb;fill:none;stroke-width:2.5;stroke-dasharray:9 7}.dotb{fill:#2563eb}.doto{fill:#ea580c}.card{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1.2}.good{fill:#ecfdf5;stroke:#a7f3d0}.metric{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}.metriclabel{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}
  </style>
  <text x="600" y="42" text-anchor="middle" class="title">Experiment AD — Time-varying mean removal by predeclared temporal projection</text>
  <text x="600" y="67" text-anchor="middle" class="label">AR(1) φ = 0.4 · N = 800 · 96 trials per amplitude · 480/480 projected events covered</text>

  <!-- Panel 1 -->
  <rect x="42" y="96" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="125" text-anchor="middle" class="panel-title">Affine nuisance projection removes trend bias</text>
  <line x1="92" y1="350" x2="552" y2="350" class="axis"/><line x1="92" y1="154" x2="92" y2="350" class="axis"/>
  <line x1="92" y1="308" x2="552" y2="308" class="grid"/><line x1="92" y1="238" x2="552" y2="238" class="grid"/><line x1="92" y1="168" x2="552" y2="168" class="grid"/>
  <text x="82" y="312" text-anchor="end" class="tick">0.1</text><text x="82" y="242" text-anchor="end" class="tick">1</text><text x="82" y="172" text-anchor="end" class="tick">100</text>
  <text x="322" y="388" text-anchor="middle" class="label">linear-trend amplitude</text><text transform="translate(25 252) rotate(-90)" text-anchor="middle" class="label">median relative covariance error (log scale)</text>
  <polyline points="106,298 151,299 240,298 374,298 538,298" class="blue"/><polyline points="106,298 151,235 240,169 374,127 538,97" class="orange"/>
  <circle cx="106" cy="298" r="5" class="dotb"/><circle cx="151" cy="299" r="5" class="dotb"/><circle cx="240" cy="298" r="5" class="dotb"/><circle cx="374" cy="298" r="5" class="dotb"/><circle cx="538" cy="298" r="5" class="dotb"/>
  <circle cx="106" cy="298" r="5" class="doto"/><circle cx="151" cy="235" r="5" class="doto"/><circle cx="240" cy="169" r="5" class="doto"/><circle cx="374" cy="127" r="5" class="doto"/><circle cx="538" cy="97" r="5" class="doto"/>
  <text x="106" y="368" text-anchor="middle" class="tick">0</text><text x="151" y="368" text-anchor="middle" class="tick">1</text><text x="240" y="368" text-anchor="middle" class="tick">3</text><text x="374" y="368" text-anchor="middle" class="tick">6</text><text x="538" y="368" text-anchor="middle" class="tick">10</text>
  <line x1="112" y1="143" x2="141" y2="143" class="blue"/><text x="149" y="148" class="small">projected estimator ≈ 0.14</text><line x1="320" y1="143" x2="349" y2="143" class="orange"/><text x="357" y="148" class="small">constant centering</text>

  <!-- Panel 2 -->
  <rect x="614" y="96" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="125" text-anchor="middle" class="panel-title">The theorem radius is trend-amplitude invariant</text>
  <line x1="664" y1="350" x2="1124" y2="350" class="axis"/><line x1="664" y1="154" x2="664" y2="350" class="axis"/>
  <line x1="664" y1="301" x2="1124" y2="301" class="grid"/><line x1="664" y1="252" x2="1124" y2="252" class="grid"/><line x1="664" y1="203" x2="1124" y2="203" class="grid"/><line x1="664" y1="154" x2="1124" y2="154" class="grid"/>
  <text x="654" y="305" text-anchor="end" class="tick">0.2</text><text x="654" y="256" text-anchor="end" class="tick">0.4</text><text x="654" y="207" text-anchor="end" class="tick">0.6</text><text x="654" y="158" text-anchor="end" class="tick">0.8</text>
  <line x1="664" y1="164" x2="1124" y2="164" class="dash"/><text x="1114" y="157" text-anchor="end" class="small">97.5% analytical radius = 0.7581</text>
  <polyline points="678,301 723,306 812,299 946,297 1110,306" class="blue"/>
  <circle cx="678" cy="301" r="5" class="dotb"/><circle cx="723" cy="306" r="5" class="dotb"/><circle cx="812" cy="299" r="5" class="dotb"/><circle cx="946" cy="297" r="5" class="dotb"/><circle cx="1110" cy="306" r="5" class="dotb"/>
  <text x="894" y="388" text-anchor="middle" class="label">linear-trend amplitude</text><text transform="translate(623 252) rotate(-90)" text-anchor="middle" class="label">95th-percentile relative error</text>
  <text x="678" y="368" text-anchor="middle" class="tick">0</text><text x="723" y="368" text-anchor="middle" class="tick">1</text><text x="812" y="368" text-anchor="middle" class="tick">3</text><text x="946" y="368" text-anchor="middle" class="tick">6</text><text x="1110" y="368" text-anchor="middle" class="tick">10</text>

  <!-- Panel 3 -->
  <rect x="42" y="426" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="455" text-anchor="middle" class="panel-title">Recorded coverage of the projected covariance event</text>
  <line x1="92" y1="680" x2="552" y2="680" class="axis"/><line x1="92" y1="484" x2="92" y2="680" class="axis"/>
  <line x1="92" y1="641" x2="552" y2="641" class="grid"/><line x1="92" y1="582" x2="552" y2="582" class="grid"/><line x1="92" y1="523" x2="552" y2="523" class="grid"/>
  <line x1="92" y1="489" x2="552" y2="489" class="dash"/><text x="544" y="481" text-anchor="end" class="small">nominal 0.975</text>
  <polyline points="106,484 151,484 240,484 374,484 538,484" class="blue"/><circle cx="106" cy="484" r="5" class="dotb"/><circle cx="151" cy="484" r="5" class="dotb"/><circle cx="240" cy="484" r="5" class="dotb"/><circle cx="374" cy="484" r="5" class="dotb"/><circle cx="538" cy="484" r="5" class="dotb"/>
  <text x="82" y="684" text-anchor="end" class="tick">0</text><text x="82" y="645" text-anchor="end" class="tick">0.2</text><text x="82" y="586" text-anchor="end" class="tick">0.5</text><text x="82" y="527" text-anchor="end" class="tick">0.8</text><text x="82" y="488" text-anchor="end" class="tick">1.0</text>
  <text x="322" y="716" text-anchor="middle" class="label">linear-trend amplitude</text><text transform="translate(25 582) rotate(-90)" text-anchor="middle" class="label">empirical coverage</text>
  <text x="106" y="698" text-anchor="middle" class="tick">0</text><text x="151" y="698" text-anchor="middle" class="tick">1</text><text x="240" y="698" text-anchor="middle" class="tick">3</text><text x="374" y="698" text-anchor="middle" class="tick">6</text><text x="538" y="698" text-anchor="middle" class="tick">10</text>

  <!-- Panel 4 -->
  <rect x="614" y="426" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="455" text-anchor="middle" class="panel-title">Numerical nuisance invariance</text>
  <rect x="650" y="485" width="144" height="106" rx="8" class="good"/><text x="722" y="525" text-anchor="middle" class="metric">≤ 1.01×10⁻¹⁵</text><text x="722" y="550" text-anchor="middle" class="metriclabel">max spectral change</text><text x="722" y="570" text-anchor="middle" class="metriclabel">after adding arbitrary H B</text>
  <rect x="810" y="485" width="144" height="106" rx="8" class="good"/><text x="882" y="525" text-anchor="middle" class="metric">480 / 480</text><text x="882" y="550" text-anchor="middle" class="metriclabel">projected covariance events</text><text x="882" y="570" text-anchor="middle" class="metriclabel">inside theorem radius</text>
  <rect x="970" y="485" width="144" height="106" rx="8" class="good"/><text x="1042" y="525" text-anchor="middle" class="metric">× 876</text><text x="1042" y="550" text-anchor="middle" class="metriclabel">approx. median-error ratio</text><text x="1042" y="570" text-anchor="middle" class="metriclabel">at trend amplitude 10</text>
  <text x="886" y="625" text-anchor="middle" class="label">At amplitude 10: projected median error = 0.1390</text><text x="886" y="650" text-anchor="middle" class="label">ordinary constant mean-centering median error = 121.7578</text><text x="886" y="680" text-anchor="middle" class="small">The nuisance coefficients can be arbitrarily large; a fixed predeclared H removes H B exactly.</text>

  <text x="600" y="785" text-anchor="middle" class="small">Source: docs/nuisance_projection_calibration.json · Reproduce: python examples/nuisance_projection_calibration.py</text>
</svg>

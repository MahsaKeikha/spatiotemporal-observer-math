<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="60.0" y="62.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#162033">Experiment AO: second-order certification reveals the real bottleneck</text>
<text x="60.0" y="98.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526277">The tau cover becomes nearly diagnostic, but raw target dependence still prevents an error radius below one.</text>
<rect x="60.0" y="122.0" width="1320.0" height="66.0" rx="16" fill="#eaf2ff" stroke="#b9d1f6" stroke-width="1.5"/>
<text x="88.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">true tau = 0.78 s</text>
<text x="330.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">combined confidence = 95.0625%</text>
<text x="800.0" y="164.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#162033">same calibration and target geometry as Experiment AN</text>
<rect x="60.0" y="220.0" width="635.0" height="285.0" rx="16" fill="white" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="84.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162033">A. Certified physical-time interval</text>
<text x="84.0" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526277">Second-order Taylor control removes most of the geometric slack.</text>
<line x1="140.0" y1="452.0" x2="660.0" y2="452.0" stroke="#8da0b6" stroke-width="1.8" stroke-linecap="round"/>

<text x="125.0" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#162033">0.4</text>
<line x1="262.4" y1="446.0" x2="262.4" y2="458.0" stroke="#8da0b6" stroke-width="1.2" stroke-linecap="round"/>
<text x="247.4" y="480.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#162033">0.6</text>

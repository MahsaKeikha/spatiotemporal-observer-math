<text x="145" y="560.7" text-anchor="middle" fill="#e6edf3" font-family="Arial" font-size="12" font-weight="700">3.155</text>
<text x="145" y="767" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="11">P53B</text>
<rect x="210" y="601.3" width="70" height="143.7" rx="5" fill="#bc8cff" opacity="0.88"/>
<text x="245" y="593.3" text-anchor="middle" fill="#e6edf3" font-family="Arial" font-size="12" font-weight="700">2.572</text>
<text x="245" y="767" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="11">P54</text>
<rect x="310" y="610.1" width="70" height="134.9" rx="5" fill="#f0883e" opacity="0.88"/>
<text x="345" y="602.1" text-anchor="middle" fill="#e6edf3" font-family="Arial" font-size="12" font-weight="700">2.415</text>
<text x="345" y="767" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="11">P55</text>
<rect x="410" y="623.9" width="70" height="121.1" rx="5" fill="#3fb950" opacity="0.88"/>
<text x="445" y="615.9" text-anchor="middle" fill="#e6edf3" font-family="Arial" font-size="12" font-weight="700">2.167</text>
<text x="445" y="767" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="11">known-τ oracle</text>
<text x="640" y="480" fill="#e6edf3" font-family="Arial" font-size="20" font-weight="700">D. What Experiment AP changes</text>
<text x="650" y="525" fill="#3fb950" font-family="Arial" font-size="16" font-weight="700">Calibration geometry is now much tighter.</text>
<text x="650" y="554" fill="#e6edf3" font-family="Arial" font-size="14">Quadratic cell certificates use exact local slope plus a rigorous</text>
<text x="650" y="576" fill="#e6edf3" font-family="Arial" font-size="14">second-order remainder. They do not spend extra probability budget.</text>
<text x="650" y="620" fill="#f0883e" font-family="Arial" font-size="16" font-weight="700">But calibration is no longer the dominant bottleneck.</text>
<text x="650" y="649" fill="#e6edf3" font-family="Arial" font-size="14">Even if τ were known exactly, the current target theorem gives</text>
<text x="650" y="676" fill="#e6edf3" font-family="Arial" font-size="24" font-weight="700">εoracle = 2.167 &gt; 1</text>
<text x="650" y="716" fill="#8b949e" font-family="Arial" font-size="13">Next proof target: sharpen target covariance concentration or increase</text>
<text x="650" y="738" fill="#8b949e" font-family="Arial" font-size="13">effective target information. More calibration alone cannot close this benchmark.</text>
<text x="650" y="775" fill="#8b949e" font-family="Arial" font-size="11">These are theorem radii under the declared Gaussian exponential-relaxation model.</text>
</svg>

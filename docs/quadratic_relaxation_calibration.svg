<text x="876.0" y="205" fill="#3fb950" font-family="Arial" font-size="12">true τ = 0.78 s</text>
<text x="900" y="397" text-anchor="middle" fill="#f0883e" font-family="Arial" font-size="13" font-weight="700">73.0% width contraction at equal cell count</text>
<text x="75" y="480" fill="#e6edf3" font-family="Arial" font-size="20" font-weight="700">C. Downstream target covariance radius</text>
<text x="75" y="504" fill="#8b949e" font-family="Arial" font-size="13">Smaller is tighter. The horizontal line at 1 is a mathematical usability threshold.</text>
<line x1="90" y1="689.1" x2="550" y2="689.1" stroke="#f85149" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="548" y="683.1" text-anchor="end" fill="#f85149" font-family="Arial" font-size="11">ε = 1</text>

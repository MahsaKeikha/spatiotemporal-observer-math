<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Experiment AF: design-specific versus rank-only AR(1) interval envelopes</title>
  <desc id="desc">Four panels compare design-specific and rank-only covariance certification for a low-frequency nuisance basis as nuisance rank rises from 2 to 25. The rank-only normalization becomes negative at rank 25 while the design-specific continuum certificate remains positive.</desc>
  <rect width="1200" height="820" fill="white"/>
  <style>
    .title{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.sub{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.pt{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.lab{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.tick{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.axis{stroke:#374151;stroke-width:1.4}.grid{stroke:#d1d5db;stroke-width:1;opacity:.7}.blue{stroke:#2563eb;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}.teal{stroke:#0f766e;fill:none;stroke-width:3}.dash{stroke:#6b7280;fill:none;stroke-width:2;stroke-dasharray:8 6}.b{fill:#2563eb}.o{fill:#ea580c}.t{fill:#0f766e}.card{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1.2}.good{fill:#ecfdf5;stroke:#a7f3d0}.bad{fill:#fef2f2;stroke:#fecaca}.metric{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}.metricbad{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#991b1b}
  </style>
  <text x="600" y="40" text-anchor="middle" class="title">Experiment AF — Actual nuisance geometry prevents false certificate failure</text>
  <text x="600" y="66" text-anchor="middle" class="sub">N = 300 · AR(1) interval [0.75, 0.85] · low-frequency cosine nuisance basis · 17-point grid + analytic continuum remainder</text>

  <rect x="42" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="124" text-anchor="middle" class="pt">Certified projected normalization</text>
  <line x1="92" y1="350" x2="552" y2="350" class="axis"/><line x1="92" y1="154" x2="92" y2="350" class="axis"/>
  <line x1="92" y1="301" x2="552" y2="301" class="grid"/><line x1="92" y1="252" x2="552" y2="252" class="grid"/><line x1="92" y1="203" x2="552" y2="203" class="grid"/>
  <line x1="92" y1="350" x2="552" y2="350" class="dash"/>
  <polyline points="112,176 235,223 370,267 505,294 530,297" class="blue"/>
  <polyline points="112,176 235,228 370,296 505,347 530,356" class="orange"/>
  <circle cx="112" cy="176" r="5" class="b"/><circle cx="235" cy="223" r="5" class="b"/><circle cx="370" cy="267" r="5" class="b"/><circle cx="505" cy="294" r="5" class="b"/><circle cx="530" cy="297" r="5" class="b"/>
  <circle cx="112" cy="176" r="5" class="o"/><circle cx="235" cy="228" r="5" class="o"/><circle cx="370" cy="296" r="5" class="o"/><circle cx="505" cy="347" r="5" class="o"/><circle cx="530" cy="356" r="5" class="o"/>
  <text x="322" y="388" text-anchor="middle" class="lab">nuisance rank q</text>
  <text x="112" y="369" text-anchor="middle" class="tick">2</text><text x="235" y="369" text-anchor="middle" class="tick">8</text><text x="370" y="369" text-anchor="middle" class="tick">16</text><text x="505" y="369" text-anchor="middle" class="tick">24</text><text x="530" y="369" text-anchor="middle" class="tick">25</text>
  <line x1="110" y1="144" x2="138" y2="144" class="blue"/><text x="146" y="149" class="small">design-specific</text><line x1="270" y1="144" x2="298" y2="144" class="orange"/><text x="306" y="149" class="small">rank-only</text>

  <rect x="614" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="124" text-anchor="middle" class="pt">Projected temporal norm bounds</text>
  <line x1="664" y1="350" x2="1124" y2="350" class="axis"/><line x1="664" y1="154" x2="664" y2="350" class="axis"/>
  <polyline points="684,182 806,223 942,268 1076,294 1100,298" class="teal"/>
  <line x1="684" y1="168" x2="1100" y2="168" class="dash"/>
  <polyline points="684,292 806,303 942,319 1076,328 1100,329" class="blue"/>
  <line x1="684" y1="290" x2="1100" y2="290" class="dash"/>
  <text x="894" y="388" text-anchor="middle" class="lab">nuisance rank q</text>
  <text x="886" y="145" text-anchor="middle" class="small">Frobenius: 40.1 → 16.2 vs global 42.9</text>
  <text x="886" y="342" text-anchor="middle" class="small">Spectral: 12.24 → 4.11 vs global 12.33</text>

  <rect x="42" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="454" text-anchor="middle" class="pt">Relative covariance radius (log scale)</text>
  <line x1="92" y1="680" x2="552" y2="680" class="axis"/><line x1="92" y1="484" x2="92" y2="680" class="axis"/>
  <polyline points="112,640 235,633 370,626 505,620 530,619" class="blue"/>
  <polyline points="112,636 235,603 370,562 505,486" class="orange"/>
  <circle cx="112" cy="640" r="5" class="b"/><circle cx="235" cy="633" r="5" class="b"/><circle cx="370" cy="626" r="5" class="b"/><circle cx="505" cy="620" r="5" class="b"/><circle cx="530" cy="619" r="5" class="b"/>
  <circle cx="112" cy="636" r="5" class="o"/><circle cx="235" cy="603" r="5" class="o"/><circle cx="370" cy="562" r="5" class="o"/><circle cx="505" cy="486" r="5" class="o"/>
  <text x="322" y="716" text-anchor="middle" class="lab">nuisance rank q</text>
  <text x="314" y="492" text-anchor="middle" class="small">rank-only radius: 4.86 → 7.76 → 18.97 → 629.12 → undefined</text>
  <text x="314" y="516" text-anchor="middle" class="small">design-specific radius: 4.56 → 5.02 → 5.35 → 5.83 → 5.90</text>

  <rect x="614" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="454" text-anchor="middle" class="pt">The structural result</text>
  <rect x="650" y="490" width="220" height="98" rx="8" class="bad"/><text x="760" y="530" text-anchor="middle" class="metricbad">−8.33</text><text x="760" y="554" text-anchor="middle" class="small">rank-only lower normalization</text><text x="760" y="573" text-anchor="middle" class="small">at q = 25: certificate fails</text>
  <rect x="888" y="490" width="220" height="98" rx="8" class="good"/><text x="998" y="530" text-anchor="middle" class="metric">99.75</text><text x="998" y="554" text-anchor="middle" class="small">design-specific lower normalization</text><text x="998" y="573" text-anchor="middle" class="small">at q = 25: still positive</text>
  <rect x="650" y="610" width="458" height="82" rx="8" class="good"/><text x="879" y="642" text-anchor="middle" class="metric">The covariance did not become unidentified.</text><text x="879" y="668" text-anchor="middle" class="small">The rank-only proof discarded too much information about the declared nuisance subspace.</text>

  <text x="600" y="786" text-anchor="middle" class="small">Source: docs/design_specific_ar1_envelope.json · Reproduce: python examples/design_specific_ar1_envelope.py</text>
</svg>

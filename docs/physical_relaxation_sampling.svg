<text x="773.0" y="742.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#162033">No integer lag is invented. Each covariance entry uses the actual time separation.</text>
<text x="773.0" y="773.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#162033">Minimum covariance eigenvalue: 0.0398</text>
<text x="773.0" y="800.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#162033">Time-unit invariance error: 1.11e-16</text>
<text x="773.0" y="828.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#162033">Seconds or milliseconds describe the same covariance geometry.</text>

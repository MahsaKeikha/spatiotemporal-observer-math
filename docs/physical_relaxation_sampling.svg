<text x="769.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#162033">B. Every sampling rate recovers the same tau</text>
<text x="769.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#162033">tau = -dt / log(phi)</text>

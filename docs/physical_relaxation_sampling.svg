<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="60.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#162033">Experiment AM: one physical relaxation time across sampling schemes</text>
<text x="60.0" y="102.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162033">Proposition 53 makes tau the physical parameter and treats phi as sampling dependent.</text>
<rect x="60.0" y="126.0" width="1320.0" height="66.0" rx="18" fill="#eaf2ff" stroke="#b9d1f6" stroke-width="1.5"/>
<text x="88.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#162033">Physical invariant: tau = 0.800 s</text>
<text x="510.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162033">Different sample clocks change phi, not the underlying relaxation time.</text>
<rect x="60.0" y="220.0" width="635.0" height="300.0" rx="18" fill="white" stroke="#d8e0ea" stroke-width="1.5"/>
<text x="84.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#162033">A. Sampling rate changes the discrete correlation</text>
<text x="84.0" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#162033">phi = exp(-dt/tau)</text>

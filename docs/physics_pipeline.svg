<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Physics to inference pipeline</title>
  <desc id="desc">A diagram showing how physical observables move through dynamical modeling, nuisance removal, temporal calibration, covariance certification, candidate boundary scoring, world-tube optimization, identifiability, and interpretation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .label { font: 700 13px Arial, sans-serif; fill: #1e3a8a; }
      .arrow { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="70" y="58" class="title">Physics to inference: what the repository actually does</text>
  <text x="70" y="87" class="subtitle">The mathematics certifies a physical inference pipeline. It does not turn a statistical pattern into consciousness by definition.</text>

  <rect x="70" y="130" width="310" height="112" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="92" y="160" class="boxTitle">1. Physical observables</text>
  <text x="92" y="186" class="boxText">Measured coordinates X(t)</text>
  <text x="92" y="207" class="boxText">Units, sensors, sampling interval, geometry</text>
  <text x="92" y="228" class="small">Examples: voltage, displacement, pressure, neural signals</text>

  <rect x="485" y="130" width="310" height="112" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="507" y="160" class="boxTitle">2. Effective dynamics</text>
  <text x="507" y="188" class="boxText">X(t+1) = A(t) X(t) + epsilon(t)</text>
  <text x="507" y="210" class="boxText">A(t): coupling and propagation</text>
  <text x="507" y="231" class="small">Q(t): unresolved forcing and process-noise covariance</text>

  <rect x="900" y="130" width="310" height="112" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="922" y="160" class="boxTitle">3. Measurement cleanup</text>
  <text x="922" y="188" class="boxText">Project away declared nuisance H</text>
  <text x="922" y="210" class="boxText">Baseline, drift, known acquisition modes</text>
  <text x="922" y="231" class="small">Do not let deterministic drift masquerade as covariance</text>

  <path d="M380 186 L485 186" class="arrow"/>
  <path d="M795 186 L900 186" class="arrow"/>

  <rect x="70" y="310" width="310" height="122" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="92" y="340" class="boxTitle">4. Temporal memory</text>
  <text x="92" y="368" class="boxText">R(theta): correlation across repeated samples</text>
  <text x="92" y="390" class="boxText">phi: persistence timescale</text>
  <text x="92" y="411" class="boxText">eta: fast uncorrelated fraction</text>

  <rect x="485" y="310" width="310" height="122" rx="16" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <text x="507" y="340" class="boxTitle">5. Certified covariance</text>
  <text x="507" y="368" class="boxText">Estimate fluctuation geometry Sigma</text>
  <text x="507" y="390" class="boxText">Control finite-record matrix error</text>
  <text x="507" y="411" class="small">P41 to P52 are mainly certification machinery here</text>

  <rect x="900" y="310" width="310" height="122" rx="16" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="922" y="340" class="boxTitle">6. Candidate boundary S(t)</text>
  <text x="922" y="368" class="boxText">Which measured coordinates belong together now?</text>
  <text x="922" y="390" class="boxText">Boundary may move through the coordinate system</text>
  <text x="922" y="411" class="small">Candidate family must encode physically admissible choices</text>

  <path d="M1055 242 L1055 274 L225 274 L225 310" class="arrow"/>
  <path d="M380 371 L485 371" class="arrow"/>
  <path d="M795 371 L900 371" class="arrow"/>

  <rect x="140" y="510" width="1000" height="140" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="542" class="boxTitle">7. Physical boundary evidence</text>
  <line x1="390" y1="560" x2="390" y2="626" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="640" y1="560" x2="640" y2="626" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="890" y1="560" x2="890" y2="626" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="577" class="label">INTEGRATION</text>
  <text x="170" y="601" class="boxText">Internal parts predict one another</text>
  <text x="420" y="577" class="label">INSULATION</text>
  <text x="420" y="601" class="boxText">Outside adds limited next-step prediction</text>
  <text x="670" y="577" class="label">PERSISTENCE</text>
  <text x="670" y="601" class="boxText">Organization survives through time</text>
  <text x="920" y="577" class="label">TRANSPORT</text>
  <text x="920" y="601" class="boxText">Structure can move to new coordinates</text>
  <text x="170" y="632" class="small">These are operational dynamical properties, not definitions of subjective experience.</text>

  <path d="M1055 432 L1055 470 L640 470 L640 510" class="arrow"/>

  <rect x="140" y="710" width="280" height="108" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="162" y="740" class="boxTitle">8. World-tube optimization</text>
  <text x="162" y="768" class="boxText">Choose the best moving path W</text>
  <text x="162" y="790" class="small">Compare with the strongest competing path</text>

  <rect x="500" y="710" width="280" height="108" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="522" y="740" class="boxTitle">9. Margin and identifiability</text>
  <text x="522" y="768" class="boxText">Is the inferred boundary distinguishable?</text>
  <text x="522" y="790" class="small">Could another physical model fit the same observations?</text>

  <rect x="860" y="710" width="280" height="108" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="882" y="740" class="boxTitle">10. Interpretation boundary</text>
  <text x="882" y="768" class="boxText">Observer-like structure is not consciousness</text>
  <text x="882" y="790" class="small">Consciousness requires additional hypotheses and tests</text>

  <path d="M640 650 L640 680 L280 680 L280 710" class="arrow"/>
  <path d="M420 764 L500 764" class="arrow"/>
  <path d="M780 764 L860 764" class="arrow"/>

  <text x="70" y="866" class="subtitle">Accountability rule: every application must specify observables, units, couplings, noise, sampling, candidate geometry, nuisance structure, and model-failure tests.</text>
</svg>
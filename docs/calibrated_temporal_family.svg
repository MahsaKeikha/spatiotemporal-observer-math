<line x1="90" y1="120.0" x2="555" y2="120.0" class="grid"/><text x="65" y="124.0" class="small">1.2</text>
<line x1="90" y1="146.7" x2="555" y2="146.7" class="full"/><line x1="90" y1="212.0" x2="555" y2="212.0" class="threshold"/>
<polyline points="110,158.0 215,187.0 320,271.3 425,297.5 530,316.8" class="main"/>

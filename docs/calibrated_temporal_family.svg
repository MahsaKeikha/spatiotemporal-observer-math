<rect x="205" y="577.6" width="60" height="152.4" rx="5" fill="#9ca3af"/><text x="193" y="755" class="small">lag 1 generic</text><text x="215" y="569.6" class="small">0.091</text>
<rect x="335" y="671.5" width="60" height="58.5" rx="5" fill="#2563eb"/><text x="323" y="755" class="small">lag 2 specific</text><text x="345" y="663.5" class="small">0.035</text>

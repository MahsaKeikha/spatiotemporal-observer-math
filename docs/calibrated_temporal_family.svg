<rect x="60" y="515" width="520" height="300" rx="12" class="panel"/><text x="85" y="547" class="h">C. Increment-specific bounds remove the dependence penalty</text>
<line x1="90" y1="730.0" x2="555" y2="730.0" class="grid"/><text x="65" y="734.0" class="small">0.00</text>
<line x1="90" y1="680.0" x2="555" y2="680.0" class="grid"/><text x="65" y="684.0" class="small">0.03</text>
<line x1="90" y1="630.0" x2="555" y2="630.0" class="grid"/><text x="65" y="634.0" class="small">0.06</text>

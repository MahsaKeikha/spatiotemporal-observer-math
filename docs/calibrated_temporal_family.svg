<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Experiment AJ: data-calibrated two-parameter temporal family</title>
<desc id="desc">Proposition 50 uses lag-1 and lag-2 increment energies from independent calibration channels to learn a confidence rectangle for temporal dependence, then composes it with Proposition 49. The displayed covariance radius drops below one at 64 calibration channels.</desc>
<rect width="1200" height="900" fill="#ffffff"/>
<style>.title{font:700 28px Arial,sans-serif;fill:#111827}.sub{font:400 15px Arial,sans-serif;fill:#4b5563}.panel{fill:#f8fafc;stroke:#d1d5db;stroke-width:1.2}.h{font:700 17px Arial,sans-serif;fill:#111827}.lab{font:400 12px Arial,sans-serif;fill:#4b5563}.num{font:700 20px Arial,sans-serif;fill:#111827}.small{font:400 11px Arial,sans-serif;fill:#6b7280}.grid{stroke:#e5e7eb;stroke-width:1}.axis{stroke:#9ca3af;stroke-width:1.2}.main{fill:none;stroke:#2563eb;stroke-width:4}.bound{fill:none;stroke:#7c3aed;stroke-width:3}.low{fill:none;stroke:#059669;stroke-width:3}.truth{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5}.full{stroke:#6b7280;stroke-width:2;stroke-dasharray:8 5}.threshold{stroke:#d97706;stroke-width:2;stroke-dasharray:3 5}</style>
<text x="60" y="55" class="title">Experiment AJ | Observable calibration of temporal uncertainty</text>
<text x="60" y="83" class="sub">Lag-specific Gaussian concentration + nonlinear parameter map + compact-family matrix Chernoff bound</text>
<rect x="60" y="100" width="1080" height="70" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="85" y="128" class="lab">Full declared family radius</text><text x="85" y="155" class="num">1.142</text>
<text x="360" y="128" class="lab">64-channel calibrated radius</text><text x="360" y="155" class="num">0.871</text>
<text x="650" y="128" class="lab">256-channel calibrated radius</text><text x="650" y="155" class="num">0.772</text>
<text x="940" y="128" class="lab">Combined confidence lower bound</text><text x="940" y="155" class="num">97.52%</text>
<rect x="60" y="190" width="520" height="300" rx="12" class="panel"/><text x="85" y="222" class="h">A. Covariance certificate becomes usable</text>
<line x1="90" y1="350.0" x2="555" y2="350.0" class="grid"/><text x="65" y="354.0" class="small">0.7</text>
<line x1="90" y1="304.0" x2="555" y2="304.0" class="grid"/><text x="65" y="308.0" class="small">0.8</text>

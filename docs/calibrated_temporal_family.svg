<text x="665" y="790" class="small">green: maximum observed error     purple: theorem radius     all 192 trials covered</text>
<text x="60" y="858" class="sub">Proof and simulation are separate: the probability guarantee comes from Proposition 50; the seeded trials only show numerical scale.</text>
<text x="60" y="882" class="small">Reproduce data: python examples/calibrated_temporal_family.py   |   Render publication SVG: python examples/render_calibrated_temporal_family.py</text>

<line x1="80" y1="370" x2="520" y2="370" class="axis" />
<line x1="263.33333333333337" y1="215" x2="263.33333333333337" y2="375" class="guide" />
<text x="268.33333333333337" y="228" text-anchor="start" class="small">epsilon = 1</text>
<text x="80" y="265" text-anchor="start" class="label">Raw known-tau oracle</text>
<rect x="80" y="275" width="397.3285974442611" height="34" rx="4" class="old" />
<text x="469.3285974442611" y="299" text-anchor="end" class="value">2.167</text>
<text x="80" y="340" text-anchor="start" class="label">Innovation-whitened</text>
<rect x="80" y="350" width="80.01480326343805" height="34" rx="4" class="new" />
<text x="152.01480326343807" y="374" text-anchor="end" class="value">0.436</text>
<text x="57" y="410" text-anchor="start" class="small">The new theorem enters the perturbative epsilon &lt; 1 regime on the same 120-sample target.</text>
<text x="637" y="182" text-anchor="start" class="ptitle">B. Concentration geometry</text>
<text x="643" y="222" text-anchor="start" class="label">Raw-time projected temporal spectrum</text>
<text x="925" y="222" text-anchor="start" class="label">Innovation spectrum</text>

<rect x="0" y="0" width="1200" height="820" rx="0" class="bg" />
<text x="35" y="48" text-anchor="start" class="title">Experiment AQ - exact innovation-whitened target covariance</text>
<text x="35" y="78" text-anchor="start" class="subtitle">Proposition 56 changes the target estimator: local physical-time innovations first, covariance concentration second.</text>
<text x="35" y="106" text-anchor="start" class="value">Known-tau raw oracle 2.167  -&gt;  innovation-whitened 0.436  (79.86% reduction)</text>
<rect x="35" y="150" width="550" height="285" rx="8" class="panel" />
<rect x="615" y="150" width="550" height="285" rx="8" class="panel" />

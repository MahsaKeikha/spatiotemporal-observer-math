<text x="60.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#162033">Proposition 53: exact irregular-grid Markov factorization</text>
<text x="60.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#162033">The exponential physical-time kernel is dense in covariance form but local in precision form.</text>
<rect x="60.0" y="116.0" width="1320.0" height="64.0" rx="16" fill="#eaf2ff" stroke="#b9d1f6" stroke-width="1.4"/>
<text x="86.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#162033">Same physical relaxation time: tau = 0.800 s</text>
<text x="760.0" y="156.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#162033">alpha_i = exp(-Delta t_i / tau)</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Experiment AI: compact two-parameter temporal-family concentration</title>
  <desc id="desc">Proposition 49 replaces a one-dimensional AR1 interval by a certified finite cover of a compact temporal covariance family. A 17 by 9 cover gives relative covariance radius 0.891 versus 2.358 for a sphere-net family certificate, while all 192 seeded target-record checks remain inside the theorem radius.</desc>
  <rect width="1200" height="820" fill="white"/>
  <style>
    .title{font:700 25px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.sub{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.pt{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}.lab{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.tick{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}.tiny{font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#6b7280}.axis{stroke:#374151;stroke-width:1.4}.grid{stroke:#d1d5db;stroke-width:1;opacity:.7}.blue{stroke:#2563eb;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}.teal{stroke:#0f766e;fill:none;stroke-width:3}.gray{stroke:#6b7280;fill:none;stroke-width:2;stroke-dasharray:8 6}.b{fill:#2563eb}.o{fill:#ea580c}.t{fill:#0f766e}.card{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1.2}.good{fill:#ecfdf5;stroke:#a7f3d0}.formula{fill:#eff6ff;stroke:#bfdbfe}.metric{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}.metriclabel{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}.arrow{stroke:#6b7280;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6b7280"/></marker></defs>
  <text x="600" y="40" text-anchor="middle" class="title">Experiment AI: direct matrix concentration over a compact two-parameter temporal family</text>
  <text x="600" y="66" text-anchor="middle" class="sub">N = 400, dimension 4, affine nuisance design, 97.5% covariance confidence, R(phi, eta) = (1 - eta) R_phi + eta I</text>

  <rect x="42" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="124" text-anchor="middle" class="pt">Refining deterministic geometry crosses the radius-one boundary</text>
  <line x1="92" y1="350" x2="552" y2="350" class="axis"/><line x1="92" y1="154" x2="92" y2="350" class="axis"/>
  <line x1="92" y1="319" x2="552" y2="319" class="grid"/><line x1="92" y1="288" x2="552" y2="288" class="grid"/><line x1="92" y1="226" x2="552" y2="226" class="grid"/><line x1="92" y1="164" x2="552" y2="164" class="grid"/>
  <text x="82" y="354" text-anchor="end" class="tick">0</text><text x="82" y="323" text-anchor="end" class="tick">0.5</text><text x="82" y="292" text-anchor="end" class="tick">1.0</text><text x="82" y="230" text-anchor="end" class="tick">2.0</text><text x="82" y="168" text-anchor="end" class="tick">3.0</text>
  <line x1="92" y1="288" x2="552" y2="288" class="gray"/><text x="544" y="280" text-anchor="end" class="small">relative error = 1</text>
  <polyline points="132,164 322,191 512,204" class="orange"/>
  <polyline points="132,282 322,291 512,295" class="blue"/>
  <circle cx="132" cy="164" r="5" class="o"/><circle cx="322" cy="191" r="5" class="o"/><circle cx="512" cy="204" r="5" class="o"/>
  <circle cx="132" cy="282" r="5" class="b"/><circle cx="322" cy="291" r="5" class="b"/><circle cx="512" cy="295" r="5" class="b"/>
  <text x="132" y="371" text-anchor="middle" class="tick">15</text><text x="322" y="371" text-anchor="middle" class="tick">45</text><text x="512" y="371" text-anchor="middle" class="tick">153</text>
  <text x="322" y="391" text-anchor="middle" class="lab">temporal cover points</text>
  <line x1="116" y1="144" x2="144" y2="144" class="orange"/><text x="152" y="149" class="small">sphere-net family</text><line x1="330" y1="144" x2="358" y2="144" class="blue"/><text x="366" y="149" class="small">Proposition 49</text>
  <text x="132" y="270" text-anchor="middle" class="tiny">1.104</text><text x="322" y="309" text-anchor="middle" class="tiny">0.957</text><text x="512" y="313" text-anchor="middle" class="tiny">0.891</text>

  <rect x="614" y="94" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="124" text-anchor="middle" class="pt">Proposition 49 separates family geometry from probability</text>
  <rect x="646" y="158" width="116" height="72" rx="8" class="formula"/><text x="704" y="185" text-anchor="middle" class="lab">compact family</text><text x="704" y="207" text-anchor="middle" class="small">R in family</text>
  <line x1="768" y1="194" x2="808" y2="194" class="arrow"/>
  <rect x="816" y="158" width="116" height="72" rx="8" class="formula"/><text x="874" y="185" text-anchor="middle" class="lab">finite cover</text><text x="874" y="207" text-anchor="middle" class="small">delta_lambda, delta_d</text>
  <line x1="938" y1="194" x2="978" y2="194" class="arrow"/>
  <rect x="986" y="158" width="140" height="72" rx="8" class="formula"/><text x="1056" y="185" text-anchor="middle" class="lab">Weyl + exact mgf</text><text x="1056" y="207" text-anchor="middle" class="small">one family bound</text>
  <rect x="650" y="258" width="220" height="94" rx="8" class="good"/><text x="760" y="295" text-anchor="middle" class="metric">no cover union bound</text><text x="760" y="320" text-anchor="middle" class="metriclabel">cover points are deterministic geometry</text>
  <rect x="888" y="258" width="220" height="94" rx="8" class="good"/><text x="998" y="295" text-anchor="middle" class="metric">0.925 -> 0.231</text><text x="998" y="320" text-anchor="middle" class="metriclabel">operator covering radius, 15 -> 153 points</text>
  <text x="886" y="376" text-anchor="middle" class="small">One concentration argument can now be reused for any temporal family with a certified cover.</text>

  <rect x="42" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="314" y="454" text-anchor="middle" class="pt">Seeded target-record visibility check</text>
  <line x1="92" y1="680" x2="552" y2="680" class="axis"/><line x1="92" y1="484" x2="92" y2="680" class="axis"/>
  <line x1="92" y1="631" x2="552" y2="631" class="grid"/><line x1="92" y1="582" x2="552" y2="582" class="grid"/><line x1="92" y1="533" x2="552" y2="533" class="grid"/><line x1="92" y1="484" x2="552" y2="484" class="grid"/>
  <text x="82" y="684" text-anchor="end" class="tick">0</text><text x="82" y="635" text-anchor="end" class="tick">0.25</text><text x="82" y="586" text-anchor="end" class="tick">0.50</text><text x="82" y="537" text-anchor="end" class="tick">0.75</text><text x="82" y="488" text-anchor="end" class="tick">1.00</text>
  <polyline points="190,614 454,598" class="teal"/><polyline points="190,601 454,551" class="orange"/><polyline points="190,505 454,505" class="blue"/>
  <circle cx="190" cy="614" r="5" class="t"/><circle cx="454" cy="598" r="5" class="t"/><circle cx="190" cy="601" r="5" class="o"/><circle cx="454" cy="551" r="5" class="o"/><circle cx="190" cy="505" r="5" class="b"/><circle cx="454" cy="505" r="5" class="b"/>
  <text x="190" y="704" text-anchor="middle" class="tick">phi=.60, eta=.02</text><text x="454" y="704" text-anchor="middle" class="tick">phi=.70, eta=.04</text>
  <line x1="118" y1="474" x2="146" y2="474" class="teal"/><text x="154" y="479" class="small">95th percentile</text><line x1="270" y1="474" x2="298" y2="474" class="orange"/><text x="306" y="479" class="small">maximum observed</text><line x1="424" y1="474" x2="452" y2="474" class="blue"/><text x="460" y="479" class="small">P49 radius</text>
  <text x="314" y="722" text-anchor="middle" class="small">96 of 96 covered at each parameter pair; 192 of 192 total target records covered</text>

  <rect x="614" y="424" width="544" height="306" rx="10" class="card"/>
  <text x="886" y="454" text-anchor="middle" class="pt">Final 17 x 9 cover spans the full parameter rectangle</text>
  <rect x="688" y="493" width="396" height="168" fill="#ffffff" stroke="#9ca3af"/>
  <g stroke="#dbeafe" stroke-width="1">
    <line x1="713" y1="493" x2="713" y2="661"/><line x1="738" y1="493" x2="738" y2="661"/><line x1="763" y1="493" x2="763" y2="661"/><line x1="788" y1="493" x2="788" y2="661"/><line x1="813" y1="493" x2="813" y2="661"/><line x1="838" y1="493" x2="838" y2="661"/><line x1="863" y1="493" x2="863" y2="661"/><line x1="888" y1="493" x2="888" y2="661"/><line x1="913" y1="493" x2="913" y2="661"/><line x1="938" y1="493" x2="938" y2="661"/><line x1="963" y1="493" x2="963" y2="661"/><line x1="988" y1="493" x2="988" y2="661"/><line x1="1013" y1="493" x2="1013" y2="661"/><line x1="1038" y1="493" x2="1038" y2="661"/><line x1="1063" y1="493" x2="1063" y2="661"/>
    <line x1="688" y1="514" x2="1084" y2="514"/><line x1="688" y1="535" x2="1084" y2="535"/><line x1="688" y1="556" x2="1084" y2="556"/><line x1="688" y1="577" x2="1084" y2="577"/><line x1="688" y1="598" x2="1084" y2="598"/><line x1="688" y1="619" x2="1084" y2="619"/><line x1="688" y1="640" x2="1084" y2="640"/>
  </g>
  <circle cx="908" cy="594" r="8" fill="#0f766e"/><text x="908" y="598" text-anchor="middle" font-size="12" fill="white">*</text>
  <circle cx="1055" cy="527" r="8" fill="#ea580c"/><text x="1055" y="531" text-anchor="middle" font-size="12" fill="white">*</text>
  <text x="886" y="684" text-anchor="middle" class="lab">AR(1) coefficient phi: 0.45 to 0.72</text>
  <text x="665" y="577" transform="rotate(-90 665 577)" text-anchor="middle" class="lab">white-noise fraction eta: 0 to 0.05</text>
  <text x="886" y="712" text-anchor="middle" class="small">153 deterministic cover points, with tested target parameters marked by stars</text>

  <text x="600" y="786" text-anchor="middle" class="small">Source: docs/compact_temporal_family.json | Reproduce: python examples/compact_temporal_family.py</text>
</svg>

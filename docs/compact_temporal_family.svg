<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Experiment AI: compact temporal-family matrix concentration</title>
<desc id="desc">Proposition 49 matrix concentration over a two-parameter temporal covariance family. Refining a deterministic cover moves the matrix certificate below relative error one without a stochastic union penalty over cover points.</desc>
<rect width="1200" height="820" fill="white"/>
<style>
.title{font:700 25px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}
.sub{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}
.pt{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}
.lab{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}
.tick{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4b5563}
.small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#374151}
.tiny{font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#6b7280}
.axis{stroke:#374151;stroke-width:1.4}
.cover{stroke:#dbeafe;stroke-width:1}
.blue{stroke:#2563eb;fill:none;stroke-width:3}
.orange{stroke:#ea580c;fill:none;stroke-width:3}
.teal{stroke:#0f766e;fill:none;stroke-width:3}
.gray{stroke:#6b7280;fill:none;stroke-width:2;stroke-dasharray:8 6}
.b{fill:#2563eb} .o{fill:#ea580c} .t{fill:#0f766e}
.card{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1.2}
.good{fill:#ecfdf5;stroke:#a7f3d0}
.metric{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}
.metriclabel{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#065f46}
.star{fill:#0f766e} .startext{font:700 12px system-ui;fill:white}
</style>
<text x="600" y="40" text-anchor="middle" class="title">Experiment AI: matrix concentration over a compact two-parameter temporal family</text>
<text x="600" y="66" text-anchor="middle" class="sub">N = 400, dimension 4, affine nuisance design, 97.5% covariance confidence</text>

<rect x="42" y="94" width="544" height="306" rx="10" class="card"/>
<text x="314" y="124" text-anchor="middle" class="pt">Deterministic cover refinement crosses the radius-one boundary</text>
<line x1="92" y1="350" x2="552" y2="350" class="axis"/><line x1="92" y1="154" x2="92" y2="350" class="axis"/>
<line x1="92" y1="288.8" x2="552" y2="288.8" class="gray"/><text x="544" y="280.8" text-anchor="end" class="small">relative error = 1</text>
<polyline points="132,166.1 322,192.5 512,205.6" class="orange"/><polyline points="132,282.4 322,291.4 512,295.4" class="blue"/>
<circle cx="132" cy="166.1" r="5" class="o"/><circle cx="322" cy="192.5" r="5" class="o"/><circle cx="512" cy="205.6" r="5" class="o"/>
<circle cx="132" cy="282.4" r="5" class="b"/><circle cx="322" cy="291.4" r="5" class="b"/><circle cx="512" cy="295.4" r="5" class="b"/>
<text x="132" y="371" text-anchor="middle" class="tick">15</text><text x="322" y="371" text-anchor="middle" class="tick">45</text><text x="512" y="371" text-anchor="middle" class="tick">153</text>
<text x="322" y="391" text-anchor="middle" class="lab">temporal cover points</text>
<line x1="116" y1="144" x2="144" y2="144" class="orange"/><text x="152" y="149" class="small">sphere-net family</text>
<line x1="330" y1="144" x2="358" y2="144" class="blue"/><text x="366" y="149" class="small">Proposition 49</text>
<text x="132" y="300.4" text-anchor="middle" class="tiny">1.104</text><text x="322" y="309.4" text-anchor="middle" class="tiny">0.957</text><text x="512" y="313.4" text-anchor="middle" class="tiny">0.891</text>

<rect x="614" y="94" width="544" height="306" rx="10" class="card"/>
<text x="886" y="124" text-anchor="middle" class="pt">Better geometry costs no stochastic cover multiplicity</text>
<line x1="664" y1="350" x2="1124" y2="350" class="axis"/><line x1="664" y1="154" x2="664" y2="350" class="axis"/>
<polyline points="684,168.7 822,259.3 960,304.7" class="blue"/><polyline points="684,223.3 822,240.2 960,262.7" class="teal"/>
<circle cx="684" cy="168.7" r="5" class="b"/><circle cx="822" cy="259.3" r="5" class="b"/><circle cx="960" cy="304.7" r="5" class="b"/>
<circle cx="684" cy="223.3" r="5" class="t"/><circle cx="822" cy="240.2" r="5" class="t"/><circle cx="960" cy="262.7" r="5" class="t"/>
<text x="684" y="371" text-anchor="middle" class="tick">15</text><text x="822" y="371" text-anchor="middle" class="tick">45</text><text x="960" y="371" text-anchor="middle" class="tick">153</text>
<text x="894" y="391" text-anchor="middle" class="lab">cover points: 15 -&gt; 45 -&gt; 153</text>
<text x="654" y="158" text-anchor="end" class="tick">1.0</text><text x="654" y="354" text-anchor="end" class="tick">0</text>
<text x="1114" y="176" text-anchor="end" class="small">operator radius: 0.925 -&gt; 0.231</text>
<text x="1114" y="198" text-anchor="end" class="small">reduction vs sphere-net: 62.2%</text>
<rect x="696" y="224" width="380" height="84" rx="8" class="good"/>
<text x="886" y="258" text-anchor="middle" class="metric">no union bound over cover points</text>
<text x="886" y="283" text-anchor="middle" class="metriclabel">the finite cover is deterministic geometry inside one matrix-mgf envelope</text>

<rect x="42" y="424" width="544" height="306" rx="10" class="card"/>
<text x="314" y="454" text-anchor="middle" class="pt">Seeded target-record visibility check</text>
<line x1="92" y1="680" x2="552" y2="680" class="axis"/><line x1="92" y1="484" x2="92" y2="680" class="axis"/>
<polyline points="190,613.6 454,598.2" class="teal"/><polyline points="190,601.0 454,550.6" class="orange"/><polyline points="190,505.4 454,505.4" class="blue"/>
<circle cx="190" cy="613.6" r="5" class="t"/><circle cx="190" cy="601.0" r="5" class="o"/><circle cx="190" cy="505.4" r="5" class="b"/><circle cx="454" cy="598.2" r="5" class="t"/><circle cx="454" cy="550.6" r="5" class="o"/><circle cx="454" cy="505.4" r="5" class="b"/>
<text x="190" y="704" text-anchor="middle" class="tick">phi=.60, eta=.02</text><text x="454" y="704" text-anchor="middle" class="tick">phi=.70, eta=.04</text>
<text x="314" y="722" text-anchor="middle" class="small">192 of 192 recorded target errors covered by radius 0.891</text>
<line x1="118" y1="474" x2="146" y2="474" class="teal"/><text x="154" y="479" class="small">95th percentile</text>
<line x1="270" y1="474" x2="298" y2="474" class="orange"/><text x="306" y="479" class="small">maximum</text>
<line x1="424" y1="474" x2="452" y2="474" class="blue"/><text x="460" y="479" class="small">P49 radius</text>

<rect x="614" y="424" width="544" height="306" rx="10" class="card"/>
<text x="886" y="454" text-anchor="middle" class="pt">Final 17 x 9 cover spans the full parameter rectangle</text>
<rect x="688" y="493" width="396" height="168" fill="#fff" stroke="#9ca3af"/>
<line x1="688.0" y1="493" x2="688.0" y2="661" class="cover"/><line x1="712.8" y1="493" x2="712.8" y2="661" class="cover"/><line x1="737.5" y1="493" x2="737.5" y2="661" class="cover"/><line x1="762.2" y1="493" x2="762.2" y2="661" class="cover"/><line x1="787.0" y1="493" x2="787.0" y2="661" class="cover"/><line x1="811.8" y1="493" x2="811.8" y2="661" class="cover"/><line x1="836.5" y1="493" x2="836.5" y2="661" class="cover"/><line x1="861.2" y1="493" x2="861.2" y2="661" class="cover"/><line x1="886.0" y1="493" x2="886.0" y2="661" class="cover"/><line x1="910.8" y1="493" x2="910.8" y2="661" class="cover"/><line x1="935.5" y1="493" x2="935.5" y2="661" class="cover"/><line x1="960.2" y1="493" x2="960.2" y2="661" class="cover"/><line x1="985.0" y1="493" x2="985.0" y2="661" class="cover"/><line x1="1009.8" y1="493" x2="1009.8" y2="661" class="cover"/><line x1="1034.5" y1="493" x2="1034.5" y2="661" class="cover"/><line x1="1059.2" y1="493" x2="1059.2" y2="661" class="cover"/><line x1="1084.0" y1="493" x2="1084.0" y2="661" class="cover"/><line x1="688" y1="661.0" x2="1084" y2="661.0" class="cover"/><line x1="688" y1="640.0" x2="1084" y2="640.0" class="cover"/><line x1="688" y1="619.0" x2="1084" y2="619.0" class="cover"/><line x1="688" y1="598.0" x2="1084" y2="598.0" class="cover"/><line x1="688" y1="577.0" x2="1084" y2="577.0" class="cover"/><line x1="688" y1="556.0" x2="1084" y2="556.0" class="cover"/><line x1="688" y1="535.0" x2="1084" y2="535.0" class="cover"/><line x1="688" y1="514.0" x2="1084" y2="514.0" class="cover"/><line x1="688" y1="493.0" x2="1084" y2="493.0" class="cover"/>
<circle cx="908.0" cy="593.8" r="8" class="star"/><text x="908.0" y="597.8" text-anchor="middle" class="startext">*</text><circle cx="1054.7" cy="526.6" r="8" class="star"/><text x="1054.7" y="530.6" text-anchor="middle" class="startext">*</text>
<text x="886" y="684" text-anchor="middle" class="lab">AR(1) coefficient phi: 0.45 to 0.72</text>
<text x="665" y="577" transform="rotate(-90 665 577)" text-anchor="middle" class="lab">white-noise fraction eta: 0.00 to 0.05</text>

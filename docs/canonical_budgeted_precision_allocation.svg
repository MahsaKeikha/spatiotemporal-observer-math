<text x="106" y="517.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">748,580</text>
<line x1="120" y1="414.000" x2="1140" y2="414.000" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="419.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">1,497,160</text>
<line x1="120" y1="316.000" x2="1140" y2="316.000" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="321.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">2,245,740</text>
<line x1="120" y1="218.000" x2="1140" y2="218.000" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="223.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">2,994,320</text>
<line x1="120" y1="120.000" x2="1140" y2="120.000" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="125.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">3,742,900</text>
<rect x="174.000" y="415.677" width="68" height="194.323" rx="5" fill="#0f766e"/>
<rect x="256.000" y="415.677" width="68" height="194.323" rx="5" fill="#2563eb"/>
<rect x="338.000" y="415.677" width="68" height="194.323" rx="5" fill="#d97706"/>
<text x="290.000" y="644" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#334155">Budget 1</text>
<rect x="514.000" y="264.814" width="68" height="345.186" rx="5" fill="#0f766e"/>
<rect x="596.000" y="264.814" width="68" height="345.186" rx="5" fill="#2563eb"/>
<rect x="678.000" y="265.250" width="68" height="344.750" rx="5" fill="#d97706"/>
<text x="630.000" y="644" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#334155">Budget 2</text>
<rect x="854.000" y="120.000" width="68" height="490.000" rx="5" fill="#0f766e"/>
<rect x="936.000" y="120.000" width="68" height="490.000" rx="5" fill="#2563eb"/>
<rect x="1018.000" y="120.000" width="68" height="490.000" rx="5" fill="#d97706"/>
<text x="970.000" y="644" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#334155">Budget 3</text>

<text x="870" y="59" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Greedy recomputed</text>
<rect x="1010" y="48" width="13" height="13" rx="2" fill="#d97706"/>
<text x="1030" y="59" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Static BI rank</text>

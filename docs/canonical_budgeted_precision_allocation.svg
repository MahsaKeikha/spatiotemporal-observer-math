<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Canonical budgeted precision allocation</title>
<desc id="description">Certified ambiguity reduction for exact restricted, greedy recomputed, and static single-block ranking policies at budgets one to three.</desc>
<rect width="1200" height="720" rx="24" fill="#f8fafc"/>
<text x="60" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Budgeted canonical precision allocation</text>
<text x="60" y="82" font-family="system-ui,sans-serif" font-size="15" fill="#475569">Joint reruns expose interaction effects that single-block ranking cannot certify</text>
<line x1="120" y1="610.000" x2="1140" y2="610.000" stroke="#cbd5e1" stroke-width="1"/>
<text x="106" y="615.000" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#475569">0</text>

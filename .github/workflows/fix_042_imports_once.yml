name: fix-0.42-imports-once

on:
  push:
    branches:
      - prop53-irregular-tau-evalue

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run temporary 0.42.0 import ordering fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prop53-irregular-tau-evalue
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Ruff import ordering only
        run: |
          python -m pip install 'ruff>=0.5'
          ruff check --select I --fix src/observer_math/__init__.py tests/test_irregular_relaxation_evalue_artifact.py
      - name: Commit import-order fix
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add src/observer_math/__init__.py tests/test_irregular_relaxation_evalue_artifact.py
          git commit -m "Sort 0.42.0 package imports"
          git push origin HEAD:prop53-irregular-tau-evalue

name: package-0.43-once

on:
  push:
    branches:
      - prop54-two-scale-irregular-tau-cover

permissions:
  contents: write

jobs:
  package:
    if: github.event.head_commit.message == 'Add temporary 0.43.0 packaging workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop54-two-scale-irregular-tau-cover
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package tooling
        run: python -m pip install -e ".[dev]"
      - name: Apply release packaging
        run: |
          python tools/package_043_once.py
          ruff check --fix src/observer_math/__init__.py
      - name: Commit release packaging
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add README.md CHANGELOG.md docs/research_index.md docs/api_temporal_calibration.md docs/reproducible_results.md docs/recent_release_history.md src/observer_math/__init__.py
          git commit -m "Apply 0.43.0 release packaging"
          git push origin HEAD:prop54-two-scale-irregular-tau-cover

name: capture-aq-once

on:
  push:
    branches:
      - prop56-innovation-whitened-target-covariance

jobs:
  capture:
    if: github.event.head_commit.message == 'Run temporary Experiment AQ capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python examples/innovation_whitened_target_covariance.py
      - run: cat docs/innovation_whitened_target_covariance.json

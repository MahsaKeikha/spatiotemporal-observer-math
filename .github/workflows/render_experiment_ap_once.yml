name: render-experiment-ap-once

on:
  push:
    branches:
      - prop55-local-curvature-relaxation-cover

permissions:
  contents: write

jobs:
  render:
    if: github.event.head_commit.message == 'Add temporary Experiment AP figure runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop55-local-curvature-relaxation-cover
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Render Experiment AP
        run: python examples/render_quadratic_relaxation_calibration.py
      - name: Commit Experiment AP figure
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add docs/quadratic_relaxation_calibration.svg
          git commit -m "Render Experiment AP quadratic calibration figure"
          git push origin HEAD:prop55-local-curvature-relaxation-cover

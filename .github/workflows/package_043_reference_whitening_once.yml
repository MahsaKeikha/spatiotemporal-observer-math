name: package-0.43-reference-whitening-once

on:
  push:
    branches:
      - prop54-second-order-reference-whitening

permissions:
  contents: write

jobs:
  package:
    if: github.event.head_commit.message == 'Run temporary 0.43.0 release packager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop54-second-order-reference-whitening
          fetch-depth: 0
      - name: Apply asserted release packaging
        run: python tools/package_043_reference_whitening_once.py
      - name: Commit release packaging
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add pyproject.toml CITATION.cff src/observer_math/__init__.py README.md CHANGELOG.md docs/research_index.md docs/assumption_ledger.md docs/api_temporal_calibration.md docs/reproducible_results.md docs/recent_release_history.md
          git commit -m "Apply 0.43.0 reference-whitening release packaging"
          git push origin HEAD:prop54-second-order-reference-whitening

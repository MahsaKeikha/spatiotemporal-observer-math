name: run-experiment-ap-once

on:
  push:
    branches:
      - prop55-local-curvature-relaxation-cover

permissions:
  contents: write

jobs:
  experiment:
    if: github.event.head_commit.message == 'Add temporary Experiment AP runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop55-local-curvature-relaxation-cover
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run Experiment AP
        run: python examples/quadratic_relaxation_calibration.py
      - name: Commit Experiment AP record
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add docs/quadratic_relaxation_calibration.json
          git commit -m "Record Experiment AP quadratic calibration results"
          git push origin HEAD:prop55-local-curvature-relaxation-cover

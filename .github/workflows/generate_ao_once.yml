name: generate-ao-once

on:
  push:
    branches:
      - prop54-second-order-irregular-tau-cover

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Add temporary Experiment AO generation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop54-second-order-irregular-tau-cover
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Rebuild Experiment AO
        run: |
          python examples/second_order_irregular_tau_cover.py > /tmp/ao.json
          python examples/render_second_order_irregular_tau_cover.py
      - name: Commit deterministic artifacts
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add docs/second_order_irregular_tau_cover.json docs/second_order_irregular_tau_cover.svg
          if git diff --cached --quiet; then
            echo "Experiment AO artifacts already exact"
          else
            git commit -m "Generate Experiment AO artifacts"
            git push origin HEAD:prop54-second-order-irregular-tau-cover
          fi

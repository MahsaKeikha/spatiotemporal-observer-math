name: generate-ao-once

on:
  push:
    branches:
      - prop54-second-order-reference-whitening

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Run one-shot Experiment AO artifact generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop54-second-order-reference-whitening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Generate Experiment AO record and figure
        run: |
          python examples/second_order_reference_whitening.py
          python examples/render_second_order_reference_whitening.py
      - name: Commit generated artifacts
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add docs/second_order_reference_whitening.json docs/second_order_reference_whitening.svg
          git commit -m "Record Experiment AO reproducible artifacts"
          git push origin HEAD:prop54-second-order-reference-whitening

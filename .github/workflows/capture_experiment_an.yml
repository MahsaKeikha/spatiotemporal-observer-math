name: capture-experiment-an

on:
  push:
    branches:
      - prop53-irregular-tau-evalue
    paths:
      - .github/workflows/capture_experiment_an.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop53-irregular-tau-evalue
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python examples/irregular_relaxation_evalue_calibration.py >/dev/null
      - name: Print compact exact summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('docs/irregular_relaxation_evalue_calibration.json').read_text())
          summary = {
              'continuum_evalue': {
                  key: value
                  for key, value in record['continuum_evalue'].items()
                  if key not in {'diagnostic_tau_grid_seconds', 'diagnostic_log_evalues', 'diagnostic_accepted_mask'}
              },
              'certified_outer_cover': {
                  key: value
                  for key, value in record['certified_outer_cover'].items()
                  if key not in {'cell_edges_seconds', 'retained_mask'}
              },
              'time_unit_invariance': record['time_unit_invariance'],
              'independent_target_composition': {
                  key: value
                  for key, value in record['independent_target_composition'].items()
                  if key != 'target_sample_times_seconds'
              },
              'calibration_information_scaling': record['calibration_information_scaling'],
          }
          print(json.dumps(summary, indent=2))
          PY

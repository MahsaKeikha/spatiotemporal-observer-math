name: package-0.42-once

on:
  push:
    branches:
      - prop53-irregular-tau-evalue

permissions:
  contents: write

jobs:
  package:
    if: github.event.head_commit.message == 'Fix 0.42.0 README figure count'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prop53-irregular-tau-evalue
          fetch-depth: 0
      - name: Correct stale explanatory count
        run: python tools/fix_042_readme_once.py
      - name: Commit README correction
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add README.md
          git commit -m "Correct 0.42.0 figure-count note"
          git push origin HEAD:prop53-irregular-tau-evalue

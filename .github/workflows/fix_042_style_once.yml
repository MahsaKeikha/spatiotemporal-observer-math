name: fix-0.42-style-once

on:
  push:
    branches:
      - prop53-irregular-tau-evalue

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run temporary 0.42.0 punctuation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prop53-irregular-tau-evalue
          fetch-depth: 0
      - name: Fix documentation punctuation
        run: python tools/fix_042_doc_punctuation_once.py
      - name: Commit punctuation fix
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add CHANGELOG.md docs/api_temporal_calibration.md docs/reproducible_results.md docs/research_index.md
          git commit -m "Use ordinary punctuation in 0.42.0 documentation"
          git push origin HEAD:prop53-irregular-tau-evalue

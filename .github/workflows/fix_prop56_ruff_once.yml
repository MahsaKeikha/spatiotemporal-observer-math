name: fix-prop56-ruff-once

on:
  push:
    branches:
      - prop56-innovation-whitened-target-covariance

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run temporary Proposition 56 Ruff fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop56-innovation-whitened-target-covariance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: ruff check --fix src/observer_math/__init__.py tests/test_innovation_whitened_target_covariance_artifact.py
      - name: Commit Ruff fixes
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add src/observer_math/__init__.py tests/test_innovation_whitened_target_covariance_artifact.py
          git commit -m "Apply Ruff ordering to Proposition 56 release files"
          git push origin HEAD:prop56-innovation-whitened-target-covariance

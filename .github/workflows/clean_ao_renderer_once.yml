name: clean-ao-renderer-once

on:
  push:
    branches:
      - prop54-second-order-reference-whitening

permissions:
  contents: write

jobs:
  clean:
    if: github.event.head_commit.message == 'Run one-shot Experiment AO renderer cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop54-second-order-reference-whitening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Remove zero-radius renderer marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('examples/render_second_order_reference_whitening.py')
          text = path.read_text(encoding='utf-8')
          old = '''    parts.append(_circle(_map(true_tau, tau_low, tau_high, px0, px1), _map(float(diagnostic["log_evalues"])[0] if False else min(log_values, key=lambda _: 0), ymin, ymax, py0, py1), 0, "#7c3aed"))\n'''
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one zero-radius marker')
          path.write_text(text.replace(old, ''), encoding='utf-8')
          PY
      - name: Regenerate SVG
        run: python examples/render_second_order_reference_whitening.py
      - name: Commit cleanup
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add examples/render_second_order_reference_whitening.py docs/second_order_reference_whitening.svg
          git commit -m "Clean Experiment AO renderer"
          git push origin HEAD:prop54-second-order-reference-whitening

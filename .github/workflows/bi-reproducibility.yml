name: BI reproducibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reproduce-bi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python examples/canonical_design_sensitivity.py
      - run: git diff --exit-code -- docs/canonical_design_sensitivity.json docs/canonical_design_sensitivity.svg

name: patch-prop56-public-api-once

on:
  push:
    branches:
      - prop56-innovation-whitened-target-covariance

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Proposition 56 public API patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prop56-innovation-whitened-target-covariance
          fetch-depth: 0
      - run: python tools/patch_prop56_public_api_once.py
      - name: Commit public API
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add src/observer_math/__init__.py
          git commit -m "Expose Proposition 56 through package root API"
          git push origin HEAD:prop56-innovation-whitened-target-covariance

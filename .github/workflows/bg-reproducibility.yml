name: BG reproducibility

on:
  pull_request:
    paths:
      - "examples/empirical_precision_ambiguity_frontier.py"
      - "src/observer_math/**"
      - "tests/test_empirical_pareto_frontier.py"
      - ".github/workflows/bg-reproducibility.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python examples/empirical_precision_ambiguity_frontier.py
      - name: Validate machine-readable record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/empirical_precision_ambiguity_frontier.json")
          d = json.loads(p.read_text())
          assert d["experiment"] == "BG"
          assert d["benchmark"] == {"n": 7, "s": 3, "T": 5, "C": 35}
          assert len(d["rows"]) == 8
          assert all(r["retained_path_count"] >= 1 for r in d["rows"])
          assert all(r["retained_edge_workload"] >= 0 for r in d["rows"])
          assert any(r["pareto_nondominated"] for r in d["rows"])
          assert Path("docs/empirical_precision_ambiguity_frontier.svg").exists()
          print(json.dumps(d, indent=2))
          PY

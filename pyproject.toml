[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatiotemporal-observer-math"
version = "0.36.0"
description = "Reproducible mathematics for spatiotemporal observer-like organization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mahsa Keikha"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "matplotlib>=3.7"]
viz = ["matplotlib>=3.7", "jupyterlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
